- version: '2026-01'
  date: '2026-01'
  published: '2026-03-30'
  url: https://support.channel99.com/hc/en-us/articles/48487117045019-January-2026-Product-Release
  breaking: false
  additions:
  - C99 MCP Server - exposes the knowledge repository plus a guarded SQL-backed data interface so an LLM can formulate runnable queries against customer tables, under read-only controls.
  - ChatGPT Connector (Beta) - links the C99 MCP Server to ChatGPT; requires an MCP Server, pilot customers only.
  - G2 Intent Connector - G2 intent signals available inside MCP; maps intent to accounts and can trigger audiences.
  - Paid Search Module - keyword and ad-group level visibility, with AI keyword analysis via the MCP Server.
  - Slack AI Assistant - native Slack assistant answering plain-English questions over account activity.
  highlights: The release that turned Channel99's AI layer into an addressable API surface.

