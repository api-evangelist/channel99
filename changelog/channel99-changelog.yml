  machine_readable_note: >-
    There is no changelog page, RSS feed or /changelog route on channel99.com. The release notes
    are individual help-centre articles, which the Zendesk Help Center API does expose as JSON at
    https://support.channel99.com/api/v2/help_center/en-us/articles.json - readable by a machine,
    but only because the docs platform provides it, not because Channel99 publishes a feed.
  api_specific: false
  api_specific_note: >-
    The notes are product release notes, not API release notes. Nothing in them versions the
    Pulsar API, records a breaking change to it, or announces a contract change - the Reporting
    API's own arrival is not even announced in a release entry. An integrator has no changelog
    that speaks to the contract they build against.
