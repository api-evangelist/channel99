tools:
  enumerated: false
  count: null
  reason: tools/list is OAuth-gated - an anonymous JSON-RPC tools/list returns HTTP 401 {"code":-32000,"message":"Missing
    Bearer token"}. Channel99 publishes no tool manifest, llms.txt tool list or connector directory listing
    with tool names, so the tool names and inputSchemas cannot be recorded without an authenticated introspection.
    NOT DERIVED AND NOT GUESSED - see mcp/channel99-tool-crosswalk.yml for the surfaces that are readable.
  data_surface_documented: true
  data_surface_note: 'Channel99 does document WHAT the MCP server can reach, if not the tool signatures:
    the FAQ and the MCP Server Information article both say the MCP services are built over the same schema
    published in the Snowflake Data Share documentation (fact tables Visit, Pageview, Impression plus
    the ad/audience/company/vendor/channel dimension tables), which is the same entity set the Pulsar
    REST API exposes.'
