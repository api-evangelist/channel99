name: Channel99 MCP Server
status: live
hosted: true
vendor_operated: true
description: Channel99 operates a first-party, remote Model Context Protocol server that exposes its B2B
  marketing performance data - website visits, pixel impressions, vendor and channel scores, audiences,
  account identity and pipeline influence - to an external LLM. The support documentation describes it
  as a read-only, OAuth-secured connector, and the January 2026 product release adds a "guarded SQL-backed
  data interface" so a model can formulate runnable queries against the customer's own tables. Channel99
  publicly markets connectors for OpenAI ChatGPT (generally available) and Anthropic Claude (beta).
endpoints:
- transport: streamable-http
  url: https://mcp.channel99.com/mcp
  method: POST
  observed_status: 401
  observed_body: '{"jsonrpc":"2.0","error":{"code":-32000,"message":"Missing Bearer token","rpcId":1}}'
  note: A real JSON-RPC error envelope, not an HTML shell - this confirms a live MCP endpoint that requires
    an OAuth bearer token before tools/list will answer.
- transport: websocket
  url: wss://mcp.channel99.com/ws
