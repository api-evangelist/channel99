- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: >-
    POST https://mcp.channel99.com/mcp answers with a JSON-RPC 2.0 error envelope
    (code -32000, "Missing Bearer token") rather than an HTML shell, and the protected-resource
    metadata follows the MCP authorization spec's discovery pattern. Tool schemas are gated.

- id: jwt
  name: RFC 7519 JSON Web Token
  conforms: true
  evidence: bearerFormat JWT on the Pulsar bearerAuth scheme; Stytch-issued, RS256, JWKS published.

- id: pagination
  name: Cursor pagination
  conforms: true
