- id: rate-limit-signalling
  name: Rate-limit response signalling
  conforms: partial
  evidence: >-
    HTTP 429 with a Retry-After header is documented on every operation, and four numeric limit
    tiers are published in the spec. No RateLimit-* or X-RateLimit-* budget headers are returned,
    so a client cannot see remaining budget before exhaustion.

- id: rfc9457
  name: RFC 9457 Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    Errors are a custom flat {error, code, message} object served as application/json, not
    application/problem+json. The code field is namespaced and machine-readable
