- id: oauth-protected-resource-metadata
  name: RFC 9728 OAuth 2.0 Protected Resource Metadata
  conforms: true
  evidence: https://mcp.channel99.com/.well-known/oauth-protected-resource returns HTTP 200 JSON naming the resource and its authorization server.

- id: oidc
  name: OpenID Connect Discovery 1.0
  conforms: true
  evidence: >-
    https://api.stytch.app.channel99.com/.well-known/openid-configuration returns HTTP 200 with
