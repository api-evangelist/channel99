note: >-
  Channel99 serves two real machine-readable well-known documents, both on the MCP host
  mcp.channel99.com: RFC 9728 OAuth Protected Resource metadata and RFC 8414 OAuth
  Authorization Server metadata. Both delegate to a Stytch-operated authorization server on a
  Channel99-controlled subdomain (api.stytch.app.channel99.com), whose OpenID Provider
  configuration is also public. The marketing site (channel99.com / www.channel99.com) 404s on
  every well-known path. app.channel99.com answers HTTP 200 on EVERY /.well-known/* path with
  the same React SPA HTML shell - that is an SPA catch-all, not a served document, and it is
  recorded below as a miss. No security.txt is published on any host, so no SecurityTxt pointer
  is emitted.

