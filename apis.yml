aid: channel99
name: Channel99
description: 'Channel99 is a B2B marketing performance and attribution platform founded by Demandbase
  creator Chris Golec. It uses AI and first-party account identification to unify cross-channel marketing
  results, verify B2B ad delivery, reveal the "dark funnel" and view-through traffic, and benchmark
  vendor and channel performance against the industry, then recommend budget and campaign changes that
  grow pipeline while reducing wasted spend. Marketing and RevOps teams export unified performance data
  into data warehouses (Snowflake), CDPs, and BI tools, and activate intent-based audiences. Backed by
  Norwest Venture Partners, Jackson Square Ventures, Industry Ventures, Ridge Ventures, Geek Ventures,
  and Marin-Sonoma Impact Ventures.'
