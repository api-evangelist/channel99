apis:
- name: Channel99 Pulsar Reporting API
  description: >-
    Channel99's Bulk Data Transfer REST API. Seventeen operations giving programmatic access to
    the account-resolved marketing facts behind the platform - website visits, pageviews, ad
    impressions and buyer-intent signals - plus the ad, audience, company, channel and vendor
    dimensions needed to join them, and a separately-permissioned IP-to-company resolution route.
    Authentication is an M2M client_credentials exchange returning a one-hour Stytch-issued JWT
    that must be paired with a matching x-client-id header. Lists are cursor-paginated (limit
    default 200, maximum 1000) with a deepObject filter[field][op] syntax and single-field sort.
  humanURL: https://support.channel99.com/hc/en-us/articles/49766041989787-Channel99-Reporting-API-Developer-Guide
  baseURL: https://pulsar.channel99.com
  tags:
  - reporting
  - marketing-attribution
  - b2b-analytics
  - ad-verification
  - intent-data
  - account-identification
  - data-export
