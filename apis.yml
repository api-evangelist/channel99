- name: Channel99 MCP Server
  description: >-
    First-party remote Model Context Protocol server that exposes Channel99 marketing
    intelligence - visits, pixel impressions, vendor and channel scores, audiences, account
    identity and pipeline influence - to an external LLM under read-only controls, including a
    guarded SQL-backed data interface. OAuth 2.1 with PKCE against a Stytch authorization server
    on a Channel99 subdomain, with RFC 9728 protected-resource and RFC 8414 authorization-server
    metadata both published. Channel99 ships connectors for OpenAI ChatGPT (GA) and Anthropic
    Claude (beta). Tool schemas require an authenticated tools/list.
  humanURL: https://support.channel99.com/hc/en-us/articles/46757387781275-Channel99-MCP-Server-Information
  baseURL: https://mcp.channel99.com
